{% load l10n %}
<tr id="agregar-sala-{{ sede.id }}" style="background: var(--surface-2);">
  <td>
    {{ form.nombre }}
    <input type="hidden" name="unidad" value="{{ unidad.id }}">
    <input type="hidden" name="anio" value="{{ anio|unlocalize }}">
    <input type="hidden" name="mes" value="{{ mes }}">
    <div style="margin-top:.3rem;">{{ form.especialidad }}</div>
  </td>
  <td>{{ form.metodo_calculo }}</td>
  <td class="num" colspan="9" style="color:var(--muted); font-size:.8rem;">
    Entra en cero — la editas después de guardar.
    <label style="margin-left:.5rem; font-weight:normal;">
      {{ form.atiende_sabados }} Atiende sábados
    </label>
  </td>
  <td></td>
  <td style="white-space:nowrap;">
    <button class="btn primary" type="button"
            hx-post="{% url 'capacidad:agregar_sala' sede.id %}"
            hx-include="#agregar-sala-{{ sede.id }} [name]"
            hx-target="#tabla-capacidad" hx-swap="innerHTML"
            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>Guardar</button>
    <button class="btn" type="button"
            hx-get="{% url 'capacidad:cancelar_agregar_sala' sede.id %}?unidad={{ unidad.id }}&anio={{ anio|unlocalize }}&mes={{ mes }}"
            hx-target="#agregar-sala-{{ sede.id }}" hx-swap="outerHTML">Cancelar</button>
  </td>
</tr>
{% if form.errors %}
<tr id="agregar-sala-{{ sede.id }}-err">
  <td colspan="13" style="color:var(--danger); font-size:.82rem;">
    {% for field, errs in form.errors.items %}{{ field }}: {{ errs|join:", " }} {% endfor %}
  </td>
</tr>
{% endif %}
