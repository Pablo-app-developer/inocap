{% load l10n %}
<div id="agregar-sala-{{ sede.id }}" class="sala-row sala-row-agregar">
  <button class="btn" type="button" style="padding:.5rem;"
          hx-get="{% url 'capacidad:agregar_sala' sede.id %}?unidad={{ unidad.id }}&anio={{ anio|unlocalize }}&mes={{ mes }}"
          hx-target="#agregar-sala-{{ sede.id }}" hx-swap="outerHTML">
    ＋ Agregar sala en {{ sede.nombre }}
  </button>
</div>
